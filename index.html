<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiberstar Asset Tagging</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f6f9; color: #111; min-height: 100vh; }

    :root {
      --fs-blue: #185FA5; --fs-blue-light: #E6F1FB; --fs-blue-mid: #378ADD;
      --fs-teal: #0F6E56;
      --fs-amber: #BA7517; --fs-amber-light: #FAEEDA;
      --fs-red: #A32D2D; --fs-red-light: #FCEBEB;
      --fs-green: #3B6D11; --fs-green-light: #EAF3DE;
      --fs-purple: #3730A3; --fs-purple-light: #EEF0FE;
      --border: #e2e4e8; --radius-md: 8px; --radius-lg: 12px;
      --text-primary: #111; --text-secondary: #666;
      --bg-primary: #ffffff; --bg-secondary: #f8f9fb;
    }

    .app { max-width: 860px; margin: 0 auto; padding: 2rem 1rem; }

    .app-header { display: flex; align-items: center; gap: 14px; margin-bottom: 2rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
    .app-logo { width: 44px; height: 44px; background: var(--fs-blue); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .app-logo svg { width: 24px; height: 24px; fill: none; stroke: white; stroke-width: 2; }
    .app-title { font-size: 18px; font-weight: 600; color: var(--text-primary); }
    .app-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: 500; }
    .status-pending { background: var(--fs-amber-light); color: var(--fs-amber); }
    .status-done { background: var(--fs-green-light); color: var(--fs-green); }

    .section-card { background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; }
    .section-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
    .section-title-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fs-blue); flex-shrink: 0; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
    .form-input { height: 38px; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0 10px; font-size: 14px; color: var(--text-primary); background: var(--bg-primary); font-family: inherit; transition: border-color 0.15s; }
    .form-input:focus { outline: none; border-color: var(--fs-blue-mid); box-shadow: 0 0 0 3px rgba(55,138,221,0.12); }
    .form-select { height: 38px; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0 10px; font-size: 14px; color: var(--text-primary); background: var(--bg-primary); font-family: inherit; cursor: pointer; }
    .form-select:focus { outline: none; border-color: var(--fs-blue-mid); }
    input[type="date"] { color: var(--text-primary); }

    .device-card { border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 1rem; overflow: hidden; }
    .device-card-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
    .device-card-title { font-size: 14px; font-weight: 500; color: var(--text-primary); display: flex; align-items: center; gap: 10px; }
    .device-num { width: 26px; height: 26px; border-radius: 50%; background: var(--fs-blue); color: white; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .device-card-body { padding: 16px; }
    .chevron { width: 16px; height: 16px; color: var(--text-secondary); transition: transform 0.2s; flex-shrink: 0; }
    .chevron.open { transform: rotate(180deg); }

    .device-thumb-rack { width: 100%; height: 100px; border-radius: var(--radius-md); background: var(--bg-secondary); border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; margin-bottom: 14px; transition: all 0.15s; }
    .device-thumb-rack:hover { border-color: var(--fs-blue-mid); background: var(--fs-blue-light); }
    .device-thumb-rack img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-placeholder { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-secondary); font-size: 12px; }

    .photo-btn-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .photo-btn { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 8px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg-primary); cursor: pointer; font-size: 11px; color: var(--text-secondary); font-family: inherit; transition: all 0.15s; }
    .photo-btn:hover { background: var(--fs-blue-light); border-color: var(--fs-blue-mid); color: var(--fs-blue); }
    .photo-btn.has-photo { border-color: var(--fs-blue-mid); color: var(--fs-blue); background: var(--fs-blue-light); }
    .photo-btn svg { width: 20px; height: 20px; }

    .photo-thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .photo-thumb { width: 68px; height: 68px; border-radius: 8px; background: var(--fs-blue-light); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; cursor: pointer; }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .photo-del { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; background: rgba(163,45,45,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; font-size: 10px; font-weight: 700; }

    .delete-device-btn { font-size: 12px; color: var(--fs-red); background: none; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 6px 14px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .delete-device-btn:hover { background: var(--fs-red-light); border-color: var(--fs-red); }

    .add-device-btn { width: 100%; padding: 13px; border: 1px dashed var(--border); border-radius: var(--radius-lg); background: none; font-family: inherit; font-size: 14px; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.15s; margin-bottom: 1.25rem; }
    .add-device-btn:hover { background: var(--fs-blue-light); border-color: var(--fs-blue-mid); color: var(--fs-blue); }

    .action-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .action-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer; border: none; transition: all 0.15s; }
    .btn-email { background: var(--fs-blue); color: white; grid-column: 1 / -1; }
    .btn-email:hover { background: #0F4D8A; }
    .btn-pdf { background: var(--fs-red-light); color: var(--fs-red); border: 1px solid rgba(163,45,45,0.2); }
    .btn-pdf:hover { background: #F7C1C1; }
    .btn-excel { background: var(--fs-green-light); color: var(--fs-green); border: 1px solid rgba(59,109,17,0.2); }
    .btn-excel:hover { background: #C0DD97; }
    .btn-zip { background: var(--fs-purple-light); color: var(--fs-purple); border: 1px solid rgba(55,48,163,0.2); grid-column: 1 / -1; font-size: 14px; padding: 14px 16px; }
    .btn-zip:hover { background: #E0E2FC; }
    .btn-zip:disabled { opacity: 0.6; cursor: not-allowed; }
    .action-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    .zip-info { font-size: 12px; color: var(--text-secondary); margin-top: 10px; padding: 10px 14px; background: var(--bg-secondary); border-radius: var(--radius-md); border: 1px solid var(--border); line-height: 1.6; }
    .zip-info b { color: var(--fs-purple); }

    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 16px; font-size: 13px; color: var(--text-primary); box-shadow: 0 4px 16px rgba(0,0,0,0.1); z-index: 999; display: none; max-width: 340px; line-height: 1.5; }
    .toast.show { display: block; animation: fadeUp 0.2s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .rack-field { margin-bottom: 14px; }
    .file-input { display: none; }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="app-header">
    <div class="app-logo">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div>
      <div class="app-title">Fiberstar Asset Tagging</div>
      <div class="app-subtitle">Network Infrastructure Asset Management</div>
    </div>
    <div style="margin-left:auto;">
      <span class="status-badge status-pending" id="formStatus">&#9679; Draft</span>
    </div>
  </div>

  <!-- Form Checked -->
  <div class="section-card">
    <div class="section-title"><span class="section-title-dot"></span>Form Checked</div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Date</label>
        <input type="date" class="form-input" id="fDate">
      </div>
      <div class="form-group">
        <label class="form-label">Site Name</label>
        <input type="text" class="form-input" placeholder="e.g. Jakarta Pusat NOC" id="fSiteName">
      </div>
      <div class="form-group">
        <label class="form-label">Site ID</label>
        <input type="text" class="form-input" placeholder="e.g. JKT-NOC-001" id="fSiteId">
      </div>
      <div class="form-group">
        <label class="form-label">Type Site</label>
        <select class="form-select" id="fTypeSite">
          <option value="">— Pilih Type —</option>
          <option>POP</option><option>HUB</option><option>BDF</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">PIC Name</label>
        <input type="text" class="form-input" placeholder="Nama PIC" id="fPicName">
      </div>
      <div class="form-group">
        <label class="form-label">Division</label>
        <select class="form-select" id="fDivision">
          <option value="">— Pilih Division —</option>
          <option>Asset</option><option>FOP</option><option>Network Development</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Form Device -->
  <div class="section-card">
    <div class="section-title"><span class="section-title-dot"></span>Form Device</div>
    <div id="deviceList"></div>
    <button class="add-device-btn" onclick="addDevice()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
      Tambah Device
    </button>
  </div>

  <!-- Action Bar -->
  <div class="section-card">
    <div class="section-title"><span class="section-title-dot"></span>Aksi</div>
    <div class="action-bar">
      <button class="action-btn btn-email" onclick="sendEmail()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        Kirim Email ke Int-Asset.Management@fiberstar.co.id
      </button>
      <button class="action-btn btn-pdf" onclick="generatePDF()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        Generate PDF
      </button>
      <button class="action-btn btn-excel" onclick="generateExcel()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="10" y1="12" x2="14" y2="16"/><line x1="14" y1="12" x2="10" y2="16"/>
        </svg>
        Generate Excel (.csv)
      </button>

      <!-- ZIP Button -->
      <button class="action-btn btn-zip" onclick="generateZip()" id="btnZip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download ZIP &mdash; Semua Foto + Data (Attach ke Email / Teams)
      </button>
    </div>
    <div class="zip-info">
      &#128230; File ZIP berisi: <b>data.csv</b> + folder per device dengan semua foto (rack, full, zoom, label) + <b>README.txt</b>.<br>
      Setelah download, attach file ZIP ke email atau drag &amp; drop ke Teams channel.
    </div>
  </div>

</div>

<input type="file" accept="image/*" capture="environment" class="file-input" id="globalFileInput">
<div class="toast" id="toast"></div>

<script>
  let devices = [];
  let deviceCounter = 0;
  let currentPhotoTarget = null;

  function showToast(msg, dur = 4000) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), dur);
  }

  function addDevice() {
    deviceCounter++;
    const id = 'dev_' + deviceCounter;
    devices.push({
      id, rack: '', rackPhotoUrl: null, rackPhotoExt: null,
      deviceName: '', serialNumber: '', partNumber: '',
      photos: { full: null, zoom: null, label: null },
      exts:   { full: null, zoom: null, label: null },
      collapsed: false
    });
    renderDevices();
    setTimeout(() => { const el = document.getElementById('dc_' + id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
  }

  function removeDevice(id) {
    devices = devices.filter(d => d.id !== id);
    renderDevices();
    showToast('Device dihapus');
  }

  function toggleDevice(id) {
    const d = devices.find(x => x.id === id);
    if (d) { d.collapsed = !d.collapsed; renderDevices(); }
  }

  function updateDevice(id, field, val) {
    const d = devices.find(x => x.id === id);
    if (d) d[field] = val;
  }

  function updateDeviceTitle(id, val, i) {
    const el = document.querySelector('#dc_' + id + ' .device-card-title span:last-child');
    if (el) el.textContent = val || ('Device ' + (i + 1));
  }

  function renderDevices() {
    const list = document.getElementById('deviceList');
    if (devices.length === 0) {
      list.innerHTML = '<div style="text-align:center;padding:2rem;color:#888;font-size:13px;">Belum ada device. Klik tombol di bawah untuk menambah.</div>';
      return;
    }
    list.innerHTML = devices.map((d, i) => `
      <div class="device-card" id="dc_${d.id}">
        <div class="device-card-header" onclick="toggleDevice('${d.id}')">
          <div class="device-card-title">
            <span class="device-num">${i + 1}</span>
            <span>${d.deviceName || 'Device ' + (i + 1)}</span>
          </div>
          <svg class="chevron ${d.collapsed ? '' : 'open'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        ${!d.collapsed ? `
        <div class="device-card-body">
          <div class="rack-field">
            <label class="form-label" style="margin-bottom:5px;display:block;">Rack</label>
            <input type="text" class="form-input" style="width:100%;" placeholder="Nama / posisi rack"
              value="${escHtml(d.rack)}" oninput="updateDevice('${d.id}','rack',this.value)">
          </div>

          <div class="form-label" style="margin-bottom:6px;">Foto Rack (jauh + label)</div>
          <div class="device-thumb-rack" onclick="triggerPhoto('${d.id}','rack')">
            ${d.rackPhotoUrl
              ? `<img src="${d.rackPhotoUrl}" alt="rack">`
              : `<div class="thumb-placeholder">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
                  </svg>
                  <span>Ambil / upload foto rack</span>
                </div>`}
          </div>

          <div class="form-group" style="margin-bottom:14px;">
            <label class="form-label">Device Full Name</label>
            <input type="text" class="form-input" placeholder="e.g. Cisco Catalyst 9200L-48P-4X"
              value="${escHtml(d.deviceName)}"
              oninput="updateDevice('${d.id}','deviceName',this.value);updateDeviceTitle('${d.id}',this.value,${i})">
          </div>

          <div class="form-label" style="margin-bottom:6px;">Foto Device</div>
          <div class="photo-btn-group">
            <button class="photo-btn ${d.photos.full ? 'has-photo' : ''}" onclick="triggerPhoto('${d.id}','full')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="4"/></svg>
              Foto Full ${d.photos.full ? '&#10003;' : ''}
            </button>
            <button class="photo-btn ${d.photos.zoom ? 'has-photo' : ''}" onclick="triggerPhoto('${d.id}','zoom')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
              Zoom IN ${d.photos.zoom ? '&#10003;' : ''}
            </button>
            <button class="photo-btn ${d.photos.label ? 'has-photo' : ''}" onclick="triggerPhoto('${d.id}','label')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
              Label ${d.photos.label ? '&#10003;' : ''}
            </button>
          </div>

          ${(d.rackPhotoUrl || d.photos.full || d.photos.zoom || d.photos.label) ? `
          <div class="photo-thumbs">
            ${d.rackPhotoUrl ? `<div class="photo-thumb" title="Rack"><img src="${d.rackPhotoUrl}"><div class="photo-del" onclick="clearPhoto('${d.id}','rack')">&#x2715;</div></div>` : ''}
            ${d.photos.full  ? `<div class="photo-thumb" title="Full"><img src="${d.photos.full}"><div class="photo-del" onclick="clearPhoto('${d.id}','full')">&#x2715;</div></div>` : ''}
            ${d.photos.zoom  ? `<div class="photo-thumb" title="Zoom"><img src="${d.photos.zoom}"><div class="photo-del" onclick="clearPhoto('${d.id}','zoom')">&#x2715;</div></div>` : ''}
            ${d.photos.label ? `<div class="photo-thumb" title="Label"><img src="${d.photos.label}"><div class="photo-del" onclick="clearPhoto('${d.id}','label')">&#x2715;</div></div>` : ''}
          </div>` : ''}

          <div class="form-grid" style="margin-bottom:14px;">
            <div class="form-group">
              <label class="form-label">Serial Number</label>
              <input type="text" class="form-input" placeholder="S/N"
                value="${escHtml(d.serialNumber)}" oninput="updateDevice('${d.id}','serialNumber',this.value)">
            </div>
            <div class="form-group">
              <label class="form-label">Part Number</label>
              <input type="text" class="form-input" placeholder="P/N"
                value="${escHtml(d.partNumber)}" oninput="updateDevice('${d.id}','partNumber',this.value)">
            </div>
          </div>

          <div style="display:flex;justify-content:flex-end;">
            <button class="delete-device-btn" onclick="removeDevice('${d.id}')">Hapus Device</button>
          </div>
        </div>` : ''}
      </div>
    `).join('');
  }

  // ── Photo Handling ─────────────────────────────────────
  function clearPhoto(id, type) {
    const d = devices.find(x => x.id === id);
    if (!d) return;
    if (type === 'rack') { d.rackPhotoUrl = null; d.rackPhotoExt = null; }
    else { d.photos[type] = null; d.exts[type] = null; }
    renderDevices();
  }

  function triggerPhoto(devId, type) {
    currentPhotoTarget = { devId, type };
    const inp = document.getElementById('globalFileInput');
    inp.value = '';
    inp.click();
  }

  document.getElementById('globalFileInput').addEventListener('change', function () {
    if (!currentPhotoTarget || !this.files[0]) return;
    const { devId, type } = currentPhotoTarget;
    const file = this.files[0];
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const reader = new FileReader();
    reader.onload = function (ev) {
      const d = devices.find(x => x.id === devId);
      if (!d) return;
      if (type === 'rack') { d.rackPhotoUrl = ev.target.result; d.rackPhotoExt = ext; }
      else { d.photos[type] = ev.target.result; d.exts[type] = ext; }
      renderDevices();
      showToast('Foto berhasil ditambahkan');
    };
    reader.readAsDataURL(file);
  });

  // ── Form Data ──────────────────────────────────────────
  function getFormData() {
    return {
      date:     document.getElementById('fDate').value,
      siteName: document.getElementById('fSiteName').value,
      siteId:   document.getElementById('fSiteId').value,
      typeSite: document.getElementById('fTypeSite').value,
      picName:  document.getElementById('fPicName').value,
      division: document.getElementById('fDivision').value,
      devices
    };
  }

  function validateForm() {
    const f = getFormData();
    if (!f.date || !f.siteName || !f.siteId || !f.typeSite) { showToast('Lengkapi data site terlebih dahulu'); return false; }
    if (!f.picName)  { showToast('PIC Name harus diisi'); return false; }
    if (!f.division) { showToast('Division harus dipilih'); return false; }
    if (f.devices.length === 0) { showToast('Minimal 1 device harus diisi'); return false; }
    return true;
  }

  // ── Send Email ─────────────────────────────────────────
  function sendEmail() {
    if (!validateForm()) return;
    const f = getFormData();
    const sub = encodeURIComponent(`Asset Tagging - ${f.siteName} (${f.siteId}) - ${f.typeSite}`);
    const body = encodeURIComponent(
      `Halo Tim Asset Management,\n\nBerikut laporan Asset Tagging:\n\n` +
      `Site     : ${f.siteName}\nSite ID  : ${f.siteId}\nType     : ${f.typeSite}\n` +
      `Date     : ${f.date}\nPIC      : ${f.picName}\nDivision : ${f.division}\n` +
      `Jumlah Device: ${f.devices.length}\n\n` +
      f.devices.map((d, i) =>
        `Device ${i+1}: ${d.deviceName}\n  Rack: ${d.rack}\n  S/N : ${d.serialNumber}\n  P/N : ${d.partNumber}`
      ).join('\n\n') +
      '\n\n* Foto terlampir dalam file ZIP (download via tombol Download ZIP)\n\nSalam,\nFiberstar Asset Tagging App'
    );
    window.location.href = `mailto:Int-Asset.Management@fiberstar.co.id?subject=${sub}&body=${body}`;
    showToast('Email dibuka! Jangan lupa attach file ZIP dari tombol Download ZIP.');
    document.getElementById('formStatus').textContent = '✓ Sent';
    document.getElementById('formStatus').className = 'status-badge status-done';
  }

  // ── Generate PDF ───────────────────────────────────────
  function generatePDF() {
    if (!validateForm()) return;
    const f = getFormData();
    const rows = f.devices.map((d, i) =>
      `<tr><td>${i+1}</td><td>${escHtml(d.rack)}</td><td>${escHtml(d.deviceName)}</td><td>${escHtml(d.serialNumber)}</td><td>${escHtml(d.partNumber)}</td></tr>`
    ).join('');
    const win = window.open('', '_blank');
    win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Asset Tagging - ${f.siteName}</title>
    <style>body{font-family:Arial,sans-serif;padding:32px;color:#111;}h1{font-size:20px;margin-bottom:8px;color:#185FA5;}.meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 24px;margin-bottom:20px;font-size:13px;}.meta span{color:#666;}table{width:100%;border-collapse:collapse;}th{background:#185FA5;color:white;padding:9px 12px;text-align:left;font-size:12px;}td{padding:9px 12px;font-size:13px;border-bottom:1px solid #eee;}tr:nth-child(even) td{background:#f9f9f9;}@media print{body{padding:16px;}}</style>
    </head><body>
    <h1>Fiberstar Asset Tagging Report</h1>
    <div class="meta">
      <p><span>Site</span>&nbsp;<b>${f.siteName}</b></p><p><span>Site ID</span>&nbsp;<b>${f.siteId}</b></p>
      <p><span>Type</span>&nbsp;<b>${f.typeSite}</b></p><p><span>Date</span>&nbsp;<b>${f.date}</b></p>
      <p><span>PIC</span>&nbsp;<b>${f.picName}</b></p><p><span>Division</span>&nbsp;<b>${f.division}</b></p>
    </div>
    <table><thead><tr><th>#</th><th>Rack</th><th>Device Name</th><th>Serial Number</th><th>Part Number</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <script>window.print();<\/script></body></html>`);
  }

  // ── Generate Excel CSV ─────────────────────────────────
  function generateExcel() {
    if (!validateForm()) return;
    const f = getFormData();
    let csv =
      `Site,${f.siteName}\nSite ID,${f.siteId}\nType,${f.typeSite}\nDate,${f.date}\n` +
      `PIC,${f.picName}\nDivision,${f.division}\n\n` +
      `No,Rack,Device Full Name,Serial Number,Part Number\n`;
    f.devices.forEach((d, i) => {
      csv += `${i+1},"${d.rack}","${d.deviceName}","${d.serialNumber}","${d.partNumber}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `AssetTagging_${f.siteId || 'export'}_${f.date || 'nodate'}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('File Excel berhasil diunduh!');
  }

  // ── Generate ZIP ───────────────────────────────────────
  async function generateZip() {
    if (!validateForm()) return;
    const f = getFormData();
    const btn = document.getElementById('btnZip');
    btn.disabled = true;
    btn.textContent = 'Menyiapkan ZIP... Mohon tunggu';

    try {
      const zip = new JSZip();
      const folderName = `AssetTagging_${(f.siteId || 'export').replace(/[^a-zA-Z0-9_-]/g,'_')}_${f.date || 'nodate'}`;
      const root = zip.folder(folderName);

      // CSV data
      let csv =
        `Site,${f.siteName}\nSite ID,${f.siteId}\nType,${f.typeSite}\nDate,${f.date}\n` +
        `PIC,${f.picName}\nDivision,${f.division}\n\n` +
        `No,Rack,Device Full Name,Serial Number,Part Number\n`;
      f.devices.forEach((d, i) => {
        csv += `${i+1},"${d.rack}","${d.deviceName}","${d.serialNumber}","${d.partNumber}"\n`;
      });
      root.file('data.csv', csv);

      // Photos per device
      let totalPhotos = 0;
      const photoSummary = [];
      f.devices.forEach((d, i) => {
        const safeName = (d.deviceName || 'noname').replace(/[^a-zA-Z0-9]/g, '_').substring(0, 24);
        const folderLabel = `Device_${String(i+1).padStart(2,'0')}_${safeName}`;
        const devFolder = root.folder(folderLabel);
        const added = [];

        if (d.rackPhotoUrl) {
          devFolder.file(`rack.${d.rackPhotoExt || 'jpg'}`, d.rackPhotoUrl.split(',')[1], { base64: true });
          added.push('rack'); totalPhotos++;
        }
        if (d.photos.full) {
          devFolder.file(`foto_full.${d.exts.full || 'jpg'}`, d.photos.full.split(',')[1], { base64: true });
          added.push('full'); totalPhotos++;
        }
        if (d.photos.zoom) {
          devFolder.file(`foto_zoom.${d.exts.zoom || 'jpg'}`, d.photos.zoom.split(',')[1], { base64: true });
          added.push('zoom'); totalPhotos++;
        }
        if (d.photos.label) {
          devFolder.file(`foto_label.${d.exts.label || 'jpg'}`, d.photos.label.split(',')[1], { base64: true });
          added.push('label'); totalPhotos++;
        }
        photoSummary.push(`  ${folderLabel}/  [${added.length > 0 ? added.join(', ') : 'tidak ada foto'}]`);
      });

      // README
      const readme =
        `FIBERSTAR ASSET TAGGING\n` +
        `${'='.repeat(50)}\n\n` +
        `Site     : ${f.siteName}\n` +
        `Site ID  : ${f.siteId}\n` +
        `Type     : ${f.typeSite}\n` +
        `Tanggal  : ${f.date}\n` +
        `PIC      : ${f.picName}\n` +
        `Divisi   : ${f.division}\n` +
        `Devices  : ${f.devices.length}\n` +
        `Total Foto: ${totalPhotos}\n\n` +
        `STRUKTUR FOLDER\n` +
        `${'─'.repeat(50)}\n` +
        `${folderName}/\n` +
        `  data.csv              <- Data semua device\n` +
        `${photoSummary.join('\n')}\n\n` +
        `Cara penggunaan:\n` +
        `1. Buka data.csv di Excel / Google Sheets\n` +
        `2. Foto tersimpan per folder device\n` +
        `3. Attach file ZIP ini ke email atau upload ke Teams\n`;
      root.file('README.txt', readme);

      // Generate & download
      const content = await zip.generateAsync({
        type: 'blob',
        compression: 'DEFLATE',
        compressionOptions: { level: 6 }
      });
      const url = URL.createObjectURL(content);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${folderName}.zip`;
      a.click();
      URL.revokeObjectURL(url);

      showToast(`ZIP berhasil! ${f.devices.length} device, ${totalPhotos} foto. Silakan attach ke email atau upload ke Teams.`, 5000);

    } catch (err) {
      showToast('Gagal membuat ZIP: ' + err.message);
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download ZIP &mdash; Semua Foto + Data (Attach ke Email / Teams)`;
    }
  }

  // ── Utility ────────────────────────────────────────────
  function escHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── Init ───────────────────────────────────────────────
  renderDevices();
  document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
